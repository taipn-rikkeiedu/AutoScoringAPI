<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI GitHub Grader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --card-border: rgba(255, 255, 255, 0.08);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --success: #10b981;
        --danger: #ef4444;
        --input-bg: rgba(15, 23, 42, 0.6);
        --input-border: rgba(255, 255, 255, 0.1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        width: 420px;
        min-height: 520px;
        padding: 16px;
        overflow-x: hidden;
      }

      /* Header & Server Status */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--card-border);
      }

      .title-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logo-icon {
        width: 24px;
        height: 24px;
      }

      h1 {
        font-size: 18px;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .server-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        border: 1px solid var(--card-border);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--danger);
        box-shadow: 0 0 8px var(--danger);
        transition: all 0.3s ease;
      }

      .status-dot.online {
        background-color: var(--success);
        box-shadow: 0 0 8px var(--success);
      }

      /* Navigation Tabs */
      .tabs {
        display: flex;
        background: rgba(255, 255, 255, 0.03);
        padding: 4px;
        border-radius: 8px;
        margin-bottom: 16px;
        border: 1px solid var(--card-border);
      }

      .tab-btn {
        flex: 1;
        background: none;
        border: none;
        color: var(--text-secondary);
        padding: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.2s ease;
      }

      .tab-btn:hover {
        color: var(--text-primary);
      }

      .tab-btn.active {
        background: var(--accent);
        color: var(--text-primary);
        box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
      }

      /* Tab Contents */
      .tab-content {
        display: none;
        animation: fadeIn 0.3s ease;
      }

      .tab-content.active {
        display: block;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Form Controls */
      .form-group {
        margin-bottom: 12px;
      }

      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-bottom: 6px;
        letter-spacing: 0.5px;
      }

      input, select, textarea {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--text-primary);
        font-size: 13px;
        transition: all 0.2s ease;
      }

      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      textarea {
        resize: vertical;
        min-height: 70px;
        font-family: inherit;
      }

      /* Buttons */
      .btn {
        display: block;
        width: 100%;
        background: var(--accent);
        color: var(--text-primary);
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        margin-top: 16px;
      }

      .btn:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--card-border);
        box-shadow: none;
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: none;
      }

      /* Report Panel & Markdown */
      .status-msg {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 12px;
        text-align: center;
        min-height: 18px;
      }

      .report-container {
        margin-top: 16px;
        display: none;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 16px;
        max-height: 380px;
        overflow-y: auto;
        backdrop-filter: blur(10px);
      }

      /* Scrollbar */
      .report-container::-webkit-scrollbar,
      body::-webkit-scrollbar {
        width: 6px;
      }
      .report-container::-webkit-scrollbar-track,
      body::-webkit-scrollbar-track {
        background: transparent;
      }
      .report-container::-webkit-scrollbar-thumb,
      body::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }
      .report-container::-webkit-scrollbar-thumb:hover,
      body::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Markdown Styled Outputs */
      .report-content {
        font-size: 13px;
        line-height: 1.6;
        color: #e2e8f0;
      }

      .report-content h2, .report-content h3 {
        margin: 14px 0 8px 0;
        font-weight: 600;
        color: #3b82f6;
      }

      .report-content h2 { font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 4px; }
      .report-content h3 { font-size: 14px; }

      .report-content p {
        margin-bottom: 10px;
      }

      .report-content ul, .report-content ol {
        margin-left: 18px;
        margin-bottom: 12px;
      }

      .report-content li {
        margin-bottom: 4px;
      }

      .report-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0;
        font-size: 12px;
      }

      .report-content th, .report-content td {
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 8px;
        text-align: left;
      }

      .report-content th {
        background-color: rgba(255, 255, 255, 0.04);
        font-weight: 600;
      }

      .report-content tr:nth-child(even) {
        background-color: rgba(255, 255, 255, 0.01);
      }

      .report-content blockquote {
        border-left: 3px solid var(--accent);
        padding-left: 10px;
        color: var(--text-secondary);
        margin: 10px 0;
        font-style: italic;
      }

      .report-content code {
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 4px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
      }

      .report-content pre {
        background: rgba(0, 0, 0, 0.3);
        padding: 10px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 10px 0;
      }

      .report-content pre code {
        background: none;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <!-- Top Header -->
    <div class="header">
      <div class="title-group">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#3B82F6"/>
          <path d="M2 17L12 22L22 17" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>AI GitHub Grader</h1>
      </div>
      <div class="server-badge">
        <div class="status-dot" id="serverStatusDot"></div>
        <span id="serverStatusText">Đang kết nối...</span>
      </div>
    </div>

    <!-- Tabs Navigation -->
    <div class="tabs">
      <button class="tab-btn active" id="tabGraderBtn">Đánh giá</button>
      <button class="tab-btn" id="tabSettingsBtn">Cấu hình</button>
    </div>

    <!-- TAB 1: GRADER -->
    <div class="tab-content active" id="tabGrader">
      <div class="form-group">
        <label for="githubUrl">GitHub Repository URL</label>
        <input
          id="githubUrl"
          type="text"
          placeholder="Tự động điền hoặc nhập: https://github.com/user/repo"
        />
      </div>

      <div class="form-group">
        <label>Chọn Đề bài & Tiêu chí mẫu</label>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <select id="classSelect">
            <option value="">-- Chọn Môn học / Lớp --</option>
          </select>
          <select id="sessionSelect" disabled>
            <option value="">-- Chọn Session / Bài học --</option>
          </select>
          <div style="display: flex; gap: 8px; align-items: stretch;">
            <select id="exerciseSelect" style="flex: 1; margin-bottom: 0;" disabled>
              <option value="">-- Chọn Bài tập --</option>
            </select>
            <button type="button" class="btn btn-secondary" id="uploadFileBtn" style="width: auto; margin-top: 0; padding: 0 12px; font-size: 12px; white-space: nowrap; display: flex; align-items: center; justify-content: center;">
              📂 Tải từ File
            </button>
            <input type="file" id="exerciseFile" accept=".txt,.md,.docx" style="display: none;" />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="criteria">Tiêu chí chấm điểm (Tùy chọn)</label>
        <textarea
          id="criteria"
          placeholder="Nhập tiêu chí chấm điểm riêng của bạn. Bỏ trống để dùng tiêu chí mặc định."
        ></textarea>
      </div>

      <button class="btn" id="gradeBtn">Bắt đầu đánh giá</button>
      
      <div class="status-msg" id="graderStatus"></div>
      
      <div class="report-container" id="reportContainer">
        <div class="report-content" id="reportContent"></div>
      </div>
    </div>

    <!-- TAB 2: CONFIGURATION -->
    <div class="tab-content" id="tabSettings">
      <div class="form-group">
        <label for="apiServer">API Backend Server</label>
        <input
          id="apiServer"
          type="text"
          placeholder="Ví dụ: http://localhost:8000"
        />
      </div>

      <div class="form-group">
        <label for="provider">AI Provider</label>
        <select id="provider">
          <option value="gemini">Google Gemini</option>
          <option value="deepseek">DeepSeek API</option>
          <option value="openrouter">OpenRouter</option>
          <option value="custom">Custom OpenAI API</option>
          <option value="local">Ollama Local AI</option>
        </select>
      </div>

      <div class="form-group">
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" placeholder="Nhập API Key hoặc Token" />
      </div>

      <div class="form-group">
        <label for="apiBaseUrl">API Base URL (Tùy chọn)</label>
        <input
          id="apiBaseUrl"
          type="text"
          placeholder="Mặc định cho Custom/OpenRouter"
        />
      </div>

      <div class="form-group">
        <label for="modelName">Model Name (Tùy chọn)</label>
        <input id="modelName" type="text" placeholder="Ví dụ: gemini-1.5-pro, deepseek-chat" />
      </div>

      <button class="btn btn-secondary" id="saveConfigBtn">Lưu Cấu Hướng Backend</button>
      <div class="status-msg" id="settingsStatus"></div>
    </div>

    <!-- Load Local Marked Library -->
    <script src="marked.min.js"></script>
    <!-- Popup Controller Script -->
    <script src="popup.js"></script>
  </body>
</html>
